name: Godot Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install templates and Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends unzip wget ca-certificates openjdk-17-jdk
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Configure Godot editor Android paths
        shell: bash
        run: |
          set -euo pipefail
          JAVA_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}"
          test -d "$SDK_PATH"
          mkdir -p /opt/android-sdk
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-cli
          mkdir -p /opt/android-sdk/cmdline-tools/latest
          cp -a /tmp/android-cli/cmdline-tools/. /opt/android-sdk/cmdline-tools/latest/
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export JAVA_HOME="$JAVA_PATH"
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk --licenses >/dev/null || true
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          SDK_PATH=/opt/android-sdk
          test -f /opt/android-sdk/build-tools/34.0.0/aapt2
          test -f "$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "Java: $JAVA_PATH"
          echo "Android SDK: $SDK_PATH"
          ls -l "$HOME/.config/godot/editor_settings-4.tres"
      - name: Import resources
        working-directory: godot
        run: godot --headless --editor --path . --import --quit
      - name: Export debug APK
        working-directory: godot
        run: |
          mkdir -p build
          echo "Checking Android tools and Godot settings"
          ls -la /opt/android-sdk/build-tools/34.0.0/ | head
          cat "$HOME/.config/godot/editor_settings-4.tres"
          echo "Inspecting Android export prerequisites"
          cat export_presets.cfg
          ls -lh "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
          ls -l /opt/android-sdk/platforms/android-34/android.jar
          grep -E 'export/android|java_sdk|debug_keystore' "$HOME/.config/godot/editor_settings-4.tres" || true
          echo "Checking Godot export validation with verbose output"
          godot --headless --verbose --editor --path . --export-debug "Android" build/NitroBattleRoyale-v0.3.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NitroBattleRoyale-v0.3-APK
          path: godot/build/*.apk
          if-no-files-found: error
