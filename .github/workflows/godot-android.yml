name: Godot Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates and configure Android tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends unzip wget ca-certificates openjdk-17-jdk
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          test -d "$SDK_PATH" || (echo "Android SDK missing at $SDK_PATH" && exit 1)
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          godot --headless --editor --path godot --quit --editor-pid 0 || true
      - name: Import resources
        working-directory: godot
        run: godot --headless --editor --path . --import --quit
      - name: Export debug APK
        working-directory: godot
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/NitroBattleRoyale-v0.3.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NitroBattleRoyale-v0.3-APK
          path: godot/build/*.apk
          if-no-files-found: error
